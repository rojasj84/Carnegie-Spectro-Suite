[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectro-suite"
version = "2.0.0"
description = "Universal Hardware-Agnostic Spectrometry Suite for Multi-Vendor Spectrometers & Detectors (Acton SpectraPro, Horiba HR460, PI-MTE, WinSpec)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "pyserial>=3.5",
    "customtkinter>=6.0.0",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]
# Princeton Instruments ST-133 / OMA-V InGaAs over libusbK (the only 64-bit
# transport that delivers pixel frames -- see IN_PROGRESS.md). Device must be
# bound to the libusbK driver via Zadig.
st133 = [
    "pyusb>=1.2",
    "libusb-package>=1.0.26",
]

[project.scripts]
spectro-suite = "spectro_suite.cli:main"
spectro = "spectro_suite.cli:main"
horiba-hr460 = "spectro_suite.cli:main"
