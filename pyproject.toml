[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carnegie-spectro-suite"
version = "2.0.0"
description = "Carnegie Spectro Suite: Modern 64-Bit Spectrometry & Raman Acquisition Suite for Multi-Vendor Instruments & Detectors"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "pyserial>=3.5",
    "customtkinter>=6.0.0",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]

[project.scripts]
carnegie-spectro = "spectro_suite.cli:main"
spectro-suite = "spectro_suite.cli:main"
spectro = "spectro_suite.cli:main"
